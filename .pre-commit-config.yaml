repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, scripts/, tests/]
      - id: ruff-format
        args: [scripts/, tests/]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        files: ^(docs/.*\.md|README\.md|AGENTS\.md)$

  - repo: local
    hooks:
      - id: check-docs-deps
        name: Check docs dependencies match uv.lock
        entry: make check-docs-deps
        language: system
        pass_filenames: false
        files: ^(requirements-docs\.txt|uv\.lock|pyproject\.toml)$
